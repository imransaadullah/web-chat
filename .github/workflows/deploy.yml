name: Deploy

# Ships the built tree to the VPS on every push to main — that's as far as
# CI goes. Installing dependencies, running migrations, and restarting the
# service is deliberately NOT automated here: `systemctl restart` needs
# root, and there's no way to hand a non-interactive SSH session from
# GitHub Actions a sudo password. That half of the deploy is
# scripts/deploy.sh, run manually on the VPS after this workflow finishes
# (see that file for why it's split this way).
#
# TrustMail's own repo/installer never clones, builds, or restarts this
# service either — it only generated our .env once and enabled
# systemd/web-chat.service (see that file — its WorkingDirectory/
# EnvironmentFile paths must be substituted to match VPS_DEPLOY_DIR below,
# since a systemd unit can't read a CI variable).
#
# Nothing in this workflow runs until VPS_HOST/VPS_USER/VPS_SSH_KEY are set
# as repo secrets — until then it's inert.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Ship the built tree to the VPS
        # Ships the whole monorepo (built dist/ folders + source), not a
        # trimmed subset — packages/server only actually needs
        # packages/shared + itself at runtime, but hand-trimming the
        # workspace list risks a package.json/package-lock.json mismatch
        # `npm ci` on the VPS would reject. Disk cost of the extra
        # packages (widget-sdk, dashboard) is trivial; correctness here
        # matters more than minimalism.
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p ${{ secrets.VPS_DEPLOY_DIR || '/opt/web-chat' }}"
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='**/node_modules' \
            --exclude='packages/server/uploads' \
            --exclude='packages/server/prisma/dev.db*' \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_DEPLOY_DIR || '/opt/web-chat' }}"
          # Just a file write under a dir the deploy user already owns (rsync
          # above already proved that) — no sudo needed, unlike the actual
          # install/migrate/restart below.
          ssh -o StrictHostKeyChecking=accept-new "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo '${{ github.sha }}' > ${{ secrets.VPS_DEPLOY_DIR || '/opt/web-chat' }}/.deploy_hash"

      - name: Print next (manual) step
        run: |
          echo "Code shipped to the VPS. Now SSH in and run:"
          echo "  ./scripts/deploy.sh ${{ secrets.VPS_DEPLOY_DIR || '/opt/web-chat' }}"
          echo "(installs deps, runs migrations, restarts the service — needs sudo, see that script for why it's not automated here)"
