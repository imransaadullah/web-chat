name: Deploy

# Autonomous CD, per TRUSTMAIL_SERVICE_GUIDE.md §2.1: this pipeline ships
# straight to the VPS on every push to main. TrustMail's own repo/installer
# never clones, builds, or restarts this service — it only generated our
# .env once and enabled systemd/web-chat.service (see that file). Nothing
# in this workflow runs until VPS_HOST/VPS_USER/VPS_SSH_KEY are set as repo
# secrets — until then it's inert.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Ship the built tree to the VPS
        # Ships the whole monorepo (built dist/ folders + source), not a
        # trimmed subset — packages/server only actually needs
        # packages/shared + itself at runtime, but hand-trimming the
        # workspace list risks a package.json/package-lock.json mismatch
        # `npm ci` on the VPS would reject. Disk cost of the extra
        # packages (widget-sdk, dashboard) is trivial; correctness here
        # matters more than minimalism.
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p /opt/web-chat"
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='**/node_modules' \
            --exclude='packages/server/uploads' \
            --exclude='packages/server/prisma/dev.db*' \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/web-chat/"

      - name: Install, migrate, restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/web-chat
            # Not --omit=dev: packages/server needs the `prisma` CLI (a
            # devDependency) at deploy time for `prisma migrate deploy`
            # below — omitting dev deps would silently break migrations.
            npm ci
            cd packages/server
            npx prisma migrate deploy
            cd /opt/web-chat
            echo "${{ github.sha }}" > .deploy_hash
            systemctl restart web-chat
